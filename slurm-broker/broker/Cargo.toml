[package]
name = "husk-slurm-broker"
version = "0.4.0"
edition = "2021"
description = "Trusted out-of-sandbox broker for husk's SLURM gateway"
license = "BSD-3-Clause"

[[bin]]
name = "husk-slurm-broker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
